name: Add me to the oral assessment catalogue
description: Add your details to the public catalogue of educators running oral assessments, including interactive oral assessment (IOA), viva-style and hybrid formats.
title: "Catalog entry: "
labels: ["catalog"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for adding yourself. This issue is public, and the details below will be published on the IOA Commons catalogue once we have checked them.
        Leave optional fields empty if you do not want them published.
  - type: input
    id: name
    attributes:
      label: Name
      description: As you want it shown, including a title such as Dr if you use one.
    validations:
      required: true
  - type: input
    id: title
    attributes:
      label: Position title
      placeholder: Senior Lecturer
    validations:
      required: false
  - type: input
    id: institution
    attributes:
      label: Institution
    validations:
      required: true
  - type: input
    id: country
    attributes:
      label: Country
    validations:
      required: true
  - type: input
    id: faculty_or_school
    attributes:
      label: Faculty or school
    validations:
      required: false
  - type: input
    id: discipline
    attributes:
      label: Discipline
      placeholder: Microbiology
    validations:
      required: true
  - type: input
    id: unit_code
    attributes:
      label: Unit code
      description: The code of the unit (subject or course) that uses the oral assessment.
    validations:
      required: false
  - type: input
    id: unit_name
    attributes:
      label: Unit name
    validations:
      required: false
  - type: dropdown
    id: year_level
    attributes:
      label: Year level
      options:
        - 1st year
        - 2nd year
        - 3rd year
        - 4th year or Honours
        - Postgraduate
        - Other
    validations:
      required: false
  - type: dropdown
    id: assessment_type
    attributes:
      label: Assessment type
      options:
        - Interactive oral assessment (IOA)
        - Viva or oral examination
        - Hybrid oral assessment
        - Other oral assessment
    validations:
      required: true
  - type: input
    id: cohort_size
    attributes:
      label: Number of students
      description: about how many students take this assessment each time it runs. A number only.
      placeholder: "450"
    validations:
      required: false
  - type: input
    id: length_minutes
    attributes:
      label: Typical length of this assessment, in minutes
      description: A number only.
      placeholder: "10"
    validations:
      required: false
  - type: input
    id: weighting_percent
    attributes:
      label: Weighting, as a percentage of the unit mark
      description: A number only.
      placeholder: "30"
    validations:
      required: false
  - type: input
    id: year_started
    attributes:
      label: Year you started using this assessment in this unit
      placeholder: "2023"
    validations:
      required: false
  - type: textarea
    id: assessment_format
    attributes:
      label: How the assessment works
      description: One or two sentences. For example, "One-to-one conversation in person, set in a hospital laboratory scenario. Six markers run sessions in parallel over one week."
    validations:
      required: true
  - type: input
    id: contact_public
    attributes:
      label: Public contact (optional)
      description: An email address or a link that people can use to contact you. It will be shown on the site. Leave empty to publish no contact.
    validations:
      required: false
  - type: input
    id: profile_url
    attributes:
      label: Profile link (optional)
      description: Your staff profile page or similar.
    validations:
      required: false
  - type: input
    id: resource_url
    attributes:
      label: Resource link (optional)
      description: A link to a rubric, guide or paper about your assessment.
    validations:
      required: false
  - type: checkboxes
    id: consent
    attributes:
      label: Consent
      options:
        - label: I agree to these details being published on IOA Commons
          required: true
