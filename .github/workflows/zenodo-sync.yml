# Copies the list of records in the IOA Commons Zenodo community into _data/zenodo.json,
# so the Resources page can show them. Runs once a day, or when started by hand
# (Actions tab > Zenodo sync > Run workflow).
#
# It reads the public Zenodo API, so it needs no API key. Never add a token here.
# The community name comes from "zenodo_community" in _config.yml.

name: Zenodo sync

on:
  schedule:
    - cron: "17 18 * * *"   # every day at 18:17 UTC (early morning in Sydney)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: zenodo-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Fetch records from Zenodo
        run: |
          set -euo pipefail

          slug=$(sed -n 's/^zenodo_community:[[:space:]]*//p' _config.yml | tr -d "\"' \r")
          if [ -z "$slug" ]; then
            echo "::error::zenodo_community is not set in _config.yml"
            exit 1
          fi
          echo "Community: $slug"

          # Zenodo allows 25 records per request without an API key,
          # so fetch up to 4 pages (100 records, newest first).
          mkdir -p "$RUNNER_TEMP/zenodo"
          for page in 1 2 3 4; do
            out="$RUNNER_TEMP/zenodo/page-$page.json"
            if ! curl -sS --fail --retry 3 -o "$out" \
              "https://zenodo.org/api/communities/$slug/records?size=25&sort=newest&page=$page"; then
              rm -f "$out"
              if [ "$page" = "1" ]; then
                echo "::warning::Could not read the Zenodo community '$slug'. It may not exist yet. Nothing was changed."
                exit 0
              fi
              break
            fi
            count=$(jq '.hits.hits | length' "$out")
            if [ "$count" -lt 25 ]; then break; fi
          done

          # Keep only the fields the Resources page uses.
          jq -s --arg community "$slug" '
            {
              community: $community,
              records: [
                .[].hits.hits[] | {
                  title: .metadata.title,
                  creators: [.metadata.creators[]?.name],
                  publication_date: .metadata.publication_date,
                  doi: (.doi // .metadata.doi // null),
                  licence: (.metadata.license | if type == "object" then .id else . end),
                  resource_type: (.metadata.resource_type.title // null),
                  description: (
                    (.metadata.description // "")
                    | gsub("<[^>]*>"; " ")
                    | gsub("\\s+"; " ")
                    | sub("^ "; "")
                    | .[0:300]
                    | if . == "" then null else . end
                  ),
                  keywords: (.metadata.keywords // []),
                  url: (.links.self_html // .links.html // null),
                  downloads: (.stats.downloads // null),
                  views: (.stats.views // null)
                }
              ]
            }
          ' "$RUNNER_TEMP"/zenodo/page-*.json > _data/zenodo.json

          echo "Records saved: $(jq '.records | length' _data/zenodo.json)"

      - name: Commit if the list changed
        run: |
          if git diff --quiet -- _data/zenodo.json; then
            echo "No change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _data/zenodo.json
          git commit -m "Update Zenodo resource list"
          git push
