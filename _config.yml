# IOA Hub site settings.
# After changing this file, stop and restart the local preview to see the change.

title: IOA Hub
tagline: Oral Assessment Hub
description: >-
  Resources, examples and educator perspectives on oral assessment, including
  interactive oral assessment (IOA), viva-style examinations and hybrid formats.
lang: en-AU

# --- Address of the site -------------------------------------------------
# Until the ioahub.au domain is connected, the site lives at
# https://<github username>.github.io/ioa-hub
github_username: HelloAngela
url: ""            # leave empty until the domain is connected
baseurl: "/ioa-hub"

# --- Things Angela still needs to supply ----------------------------------
google_form_url: "[PLACEHOLDER: Google Form URL]"
# Shared queue for suggestions, corrections, removals and general enquiries.
intake_form_url: "[PLACEHOLDER: shared intake Google Form URL]"
# The "Publish to web" CSV link of the Public tab of the catalogue Google Sheet (see README).
# Until this is filled in, the Catalogue page shows the sample rows in _data/catalog.csv.
catalog_sheet_csv_url: "[PLACEHOLDER: published Google Sheet CSV link]"
goatcounter_code: "[PLACEHOLDER: goatcounter code]"
# Zenodo community slug (https://zenodo.org/communities/ioahub/).
zenodo_community: ioahub

# --- Fixed links ----------------------------------------------------------
youtube_channel: "https://www.youtube.com/@OralAssessmentLibrary"
# The playlist the Videos page and home page carousel are copied from (the part after "list=").
youtube_playlist: PLJFJAoICnsnA

# --- Build settings (no need to change) ------------------------------------
markdown: kramdown
exclude:
  - CLAUDE.md
  - docs
  - README.md
  - assets/brand/brand-guidelines-2023.pdf
  - LICENSE
  - LICENSE-content.md
  - Gemfile
  - Gemfile.lock
  - vendor
