# IOA Hub site settings.
# After changing this file, stop and restart the local preview to see the change.

title: IOA Hub
tagline: Interactive Oral Assessment Hub
description: >-
  Resources, examples and educator perspectives on oral assessment, including
  interactive oral assessment (IOA), viva-style examinations and hybrid formats.
lang: en-AU

