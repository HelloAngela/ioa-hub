#   topic:       one word, e.g. preparation, nerves, calibration, logistics
#   title:       (optional) use this instead of the YouTube title
#   people:      (optional) use this instead of the names in the YouTube title
#   description: (optional) one or two sentences
#
# A video with no entry here still shows, but only under the "All" filters.
