# Extra details for videos. You do NOT need to add new videos here.
#
# The list of videos is copied from the YouTube playlist once a day into
# _data/playlist.json (do not edit that file by hand). A new video in the playlist
# appears on the site by itself, in playlist order, with its YouTube title.
# The home page carousel shows the first 8 videos in the playlist.
#
# A YouTube title written as "Title - People" is split in two automatically.
#
# Add an entry here only to give a video filter tags or to change how it is shown:
#   youtube_id:  (needed) the part of the YouTube address after "v=", e.g. Ebf5RcYbG-s
