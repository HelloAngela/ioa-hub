# Catalogue: examples from published sources.
#
# Units that use oral assessment, as described in articles, guides, case studies and
# conference abstracts. The people involved have not reviewed these entries, so:
#   - Only include a unit if a linked, public source describes the assessment itself.
#     (A conference programme that lists only a talk title is not enough.)
#   - Only enter facts the source states. Leave anything else out.
#   - No people column, contact details, profiles or position titles. Authors appear
#     only as part of the source citation, exactly as the source's byline gives them.
#     Never name a person the source does not name as an author.
#   - Remove an entry promptly if anyone involved asks (through the request form).
# When a unit is added to the main catalogue through the form and approved, the page
# hides the matching entry here automatically (same institution and unit code, or
# unit name if there is no code).
#
# Each entry:
#   institution, country, faculty_or_school, discipline, unit_code, unit_name,
#   year_level (1st year / 2nd year / 3rd year / 4th year or Honours / Postgraduate / Other),
#   assessment_type (Interactive oral assessment (IOA) / Viva or oral examination /
#                    Hybrid oral assessment / Other oral assessment),
#   cohort_size, length_minutes, weighting_percent, year_started (numbers only),
#   assessment_format: one or two sentences on how it runs
#   resource_url:      (optional) a public rubric or guide for this unit
#   reported:          the year of the main source
#   sources:           one or more, main source first:
#     short:   how it shows in the table, e.g. "Ward et al. (2023)"
#     authors: the byline, as the source gives it
#     year, title, publisher, url

