# Publications and useful links shown on the Publications page.
# These are things already published somewhere else. The site only links to them.
# The page sorts them newest first, so add new entries anywhere.
#
# Each entry:
#   title:    the title of the article or post
#   url:      its web address
#   authors:  who wrote it
#   date:     when it was published, as YYYY-MM-DD (use the 1st if you only know the month or year)
#   source:   where it was published, e.g. Teaching@Sydney, or a journal name
#   type:     one of guide, post, research, recording (see _data/publication-tags.yml)
#   topics:   one to four topic slugs from _data/publication-tags.yml, e.g. [ioa, large-classes]
#   note:     (optional) one sentence on what it covers
#   access:   (optional) subscription  -> shows "Subscription may be needed"
#                        registration  -> shows "Free registration may be needed"
#   free_url: (optional) a free copy (for example a repository or preprint) of a paywalled item
#
# Every entry should have at least one of the format topics: ioa or viva.

