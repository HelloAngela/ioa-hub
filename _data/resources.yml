# Informal resources (tier 2). The files themselves go in resources/files/.
# Keep each file under 20 MB.
#
# Each entry:
#   title:       shown as the card heading
#   file:        file name in resources/files/
#   description: one or two sentences
#   type:        slides / guide / template / other
#   authors:     who made it
#   licence:     leave out for the default, CC BY 4.0
#   updated:     date as YYYY-MM-DD
#   status:      current / draft   (draft shows a "Draft — may change" label)
#   topics:      a list of slugs from _data/topics.yml, e.g. [logistics, training-markers]
#   audience:    staff / students / both   (for the audience filter)
#
# The Resources page sorts by the updated date, newest first, so the order in
# this file does not matter. A resource with no audience shows only under "All".

- title: "IOA assessor playbook (excerpt)"
  file: ioa-assessor-playbook-excerpt.pdf
  description: "Nine-page excerpt from the assessor playbook for a large second-year interactive oral assessment (IOA) in microbiology and immunology. Covers how to run the conversation: four decision points, ways to extend, repair or rescue an answer, how to ask, and what to do in difficult moments. It contains no assessment questions."
  type: guide
  authors: Angela Sun
  licence: CC BY 4.0
  updated: 2026-11-15
  status: current
  topics: [questions-prompts, training-markers, adjustments-wellbeing]
  audience: staff

- title: "IOA student reading cards"
  file: ioa-student-reading-cards.pdf
  description: "Six cards students read from in the room during an interactive oral assessment (IOA): the pre-released Big Picture Question and five case scenarios, one to an A4 page. Shows one way to display pre-release information on the day so students can refer to it while they answer."
  type: other
  authors: Angela Sun
  licence: CC BY 4.0
  updated: 2026-11-15
  status: current
  topics: [design, preparing-students]
  audience: both

- title: "IOA schedule and roster template (Excel)"
  file: ioa-schedule-template.xlsx
  description: "Excel template for scheduling an interactive oral assessment (IOA) for a large cohort: sessions, room calendar, concierge roster, student roll, adjustment plans, re-sits, marker hours and a summary. The roll looks up each student's extra time, and marker hours are worked out from the session list. All names and details are invented examples."
  type: template
  authors: Angela Sun
  licence: CC BY 4.0
  updated: 2026-11-15
  status: current
  topics: [logistics, adjustments-wellbeing]
  audience: staff

